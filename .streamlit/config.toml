[theme]
base = "light"
primaryColor = "#2E7D4F"
backgroundColor = "#FBFBF8"
secondaryBackgroundColor = "#EEF4EE"
textColor = "#17251B"
linkColor = "#1F6B3F"
borderColor = "#DCE5DB"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "0.6rem"

[server]
# same limit as the project's FastAPI upload endpoint
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
